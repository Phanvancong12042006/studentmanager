<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/studentmanager.css}">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Bật tắt thanh bên">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
                <li class="nav-item d-none d-md-block">
                    <a th:href="@{/students}" class="nav-link fw-semibold">Student Manager</a>
                </li>
            </ul>
        </div>
    </nav>

    <aside class="app-sidebar sidebar-dark-primary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
            <a th:href="@{/students}" class="brand-link">
                <span class="brand-text fw-light">Student Manager</span>
            </a>
        </div>
        <div class="sidebar-wrapper">
            <nav class="mt-2">
                <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                    <li class="nav-item">
                        <a th:href="@{/students}" class="nav-link active" aria-current="page">
                            <i class="nav-icon bi bi-people-fill"></i>
                            <p>Quản lý sinh viên</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <main class="app-main">
        <div class="app-content-header">
            <div class="container-fluid">
                <h1 class="mb-0">Danh sách sinh viên</h1>
            </div>
        </div>

        <div class="app-content">
            <div class="container-fluid">
                <div class="card card-primary card-outline">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="card-title fs-4 mb-0">Danh sách</h2>
                        <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
                            <i class="bi bi-plus-lg" aria-hidden="true"></i> Thêm sinh viên
                        </button>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/students}" method="get" class="mb-3">
                            <div class="input-group">
                                <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên hoặc mã SV..." th:value="${keyword}">
                                <div class="input-group-text p-0">
                                    <button class="btn btn-primary h-100" type="submit">
                                        <i class="bi bi-search" aria-hidden="true"></i> Tìm kiếm
                                    </button>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-striped align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>Mã SV</th>
                                    <th>Họ và tên</th>
                                    <th>Email</th>
                                    <th>Số điện thoại</th>
                                    <th>Lớp</th>
                                    <th>Hành động</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="student : ${students}">
                                    <td th:text="${student.studentCode}"></td>
                                    <td th:text="${student.fullName}"></td>
                                    <td th:text="${student.email}"></td>
                                    <td th:text="${student.phone}"></td>
                                    <td th:text="${student.className}"></td>
                                    <td>
                                        <div class="btn-group" role="group">
                                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-info btn-sm text-white" title="Xem chi tiết" aria-label="Xem chi tiết">
                                                <i class="bi bi-eye" aria-hidden="true"></i>
                                            </a>
                                            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm" title="Sửa sinh viên" aria-label="Sửa sinh viên">
                                                <i class="bi bi-pencil" aria-hidden="true"></i>
                                            </a>
                                            <a th:href="@{/students/delete/{id}(id=${student.id})}" onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?');" class="btn btn-danger btn-sm" title="Xóa sinh viên" aria-label="Xóa sinh viên">
                                                <i class="bi bi-trash" aria-hidden="true"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/students/add}" th:object="${newStudent}" method="post">
                <div class="modal-header bg-success">
                    <h5 class="modal-title text-white">Thêm sinh viên mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng">
                    </button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Mã sinh viên</label>
                        <input type="text" th:field="*{studentCode}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Họ và tên</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Số điện thoại</label>
                        <input type="text" th:field="*{phone}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Lớp học</label>
                        <input type="text" th:field="*{className}" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success">Lưu sinh viên</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>
</body>
</html>
