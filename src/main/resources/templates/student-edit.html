<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-warning text-white">
            <h4 class="mb-0">CẬP NHẬT THÔNG TIN SINH VIÊN</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
                <div class="mb-3">
                    <label class="form-label">Mã sinh viên</label>
                    <input type="text" th:field="*{studentCode}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Lớp học</label>
                    <input type="text" th:field="*{className}" class="form-control">
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
