<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Sinh viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css">
    <link rel="stylesheet" th:href="@{/css/studentmanager.css}">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">
    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="Bật tắt thanh bên"><i class="bi bi-list"></i></a>
            <a th:href="@{/students}" class="nav-link fw-semibold">Student Manager</a>
        </div>
    </nav>
    <aside class="app-sidebar sidebar-dark-primary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
            <a th:href="@{/students}" class="brand-link"><span class="brand-text fw-light">Student Manager</span></a>
        </div>
        <div class="sidebar-wrapper">
            <nav class="mt-2">
                <ul class="nav sidebar-menu flex-column">
                    <li class="nav-item">
                        <a th:href="@{/students}" class="nav-link active">
                            <i class="nav-icon bi bi-people-fill"></i>
                            <p>Quản lý sinh viên</p>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <main class="app-main">
        <div class="app-content">
            <div class="container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card card-warning card-outline shadow-sm">
                            <div class="card-header">
                                <h3 class="card-title mb-0">Cập nhật thông tin sinh viên</h3>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
                                    <div class="mb-3">
                                        <label>Mã sinh viên</label>
                                        <input type="text" th:field="*{studentCode}" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>Họ và tên</label>
                                        <input type="text" th:field="*{fullName}" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>Email</label>
                                        <input type="email" th:field="*{email}" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label>Số điện thoại</label>
                                        <input type="text" th:field="*{phone}" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label>Lớp học</label>
                                        <input type="text" th:field="*{className}" class="form-control">
                                    </div>
                                    <div class="d-flex justify-content-between mt-4">
                                        <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
                                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>
</body>
</html>
