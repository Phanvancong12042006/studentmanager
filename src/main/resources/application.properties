server.port=8888

# 1. Cấu hình kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLySinhVien;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# 2. Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# 3. Cấu hình Khởi tạo Dữ liệu Tự động từ file data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# 4. Cấu hình Thymeleaf (Tắt cache để cập nhật HTML lập tức)
spring.thymeleaf.cache=false